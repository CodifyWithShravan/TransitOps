spring.application.name=transitops_backend
server.port=${PORT:8080}

# Automatically load local .env file if present (ignored safely on Render)
spring.config.import=optional:file:.env[.properties]

spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pinecone.autoconfigure.PineconeVectorStoreAutoConfiguration

# ==================================================
# DATASOURCE CONFIGURATION (Aiven MySQL / H2 Fallback)
# ==================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:transitops_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (Disabled by default in cloud; enabled locally via fallback or .env)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate DDL - automatically update tables based on JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# JWT CONFIGURATION
# ==================================================
transitops.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
transitops.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==================================================
# GEMINI CHAT & EMBEDDINGS
# ==================================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.6-flash}

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# ==================================================
# PINECONE VECTOR STORE
# ==================================================
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME:ai-rag-documents}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE:default}

# ==================================================
# MULTIPART FILE UPLOAD (FOR PDFs)
# ==================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB